              - {label: "Feature1 Text", name: "feature1_text", widget: "text"}
              - {label: "Feature1 Image", name: "feature1_image", widget: "image"}
              - {label: "Feature1 Link", name: "feature1_link", widget: "string"}
              - {label: "Feature1 Link Label", name: "feature1_link_label", widget: "string"}
              - {label: "Feature2 Script", name: "feature2_script", widget: "string"}
              - {label: "Feature2 Heading", name: "feature2_heading", widget: "string"}
              - {label: "Feature2 Text", name: "feature2_text", widget: "text"}

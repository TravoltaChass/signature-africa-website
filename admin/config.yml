backend:
  name: git-gateway
  branch: main

media_folder: "assets/img/uploads"
public_folder: "assets/img/uploads"

locale: 'en'

collections:
  - name: "content"
    label: "Site Content"
    files:
      - file: "content.json"
        label: "All Page Content"
        name: "content"
        fields:
          - label: "Global (Phone, Email, Address)"
            name: "global"
            widget: "object"
            fields:
              - {label: "Phone Office", name: "phone_office", widget: "string"}
              - {label: "Phone Office Tel", name: "phone_office_tel", widget: "string"}
              - {label: "Phone Cell", name: "phone_cell", widget: "string"}
              - {label: "Phone Cell Tel", name: "phone_cell_tel", widget: "string"}
              - {label: "Email", name: "email", widget: "string"}
              - {label: "Address", name: "address", widget: "string"}
              - {label: "Footer Blurb", name: "footer_blurb", widget: "text"}
          - label: "Home Page"
            name: "home"
            widget: "object"
            fields:
              - {label: "Hero Script", name: "hero_script", widget: "string"}
              - {label: "Hero Heading", name: "hero_heading", widget: "string"}
              - {label: "Hero Text", name: "hero_text", widget: "text"}
              - {label: "Hero Image", name: "hero_image", widget: "image"}
              - {label: "Intro Script", name: "intro_script", widget: "string"}
              - {label: "Intro Heading", name: "intro_heading", widget: "string"}
              - {label: "Intro Text", name: "intro_text", widget: "text"}
